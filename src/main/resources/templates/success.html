<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Scope India</title>

 <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{assets/lib/animate/animate.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{assets/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{assets/css/style.css}" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner"></div>
    </div>
    <!-- Spinner End -->




    <!-- Navbar Start -->
    <div class="container-fluid position-relative p-0">
        <nav class="navbar navbar-expand-lg navbar-dark px-5 py-3 py-lg-0">
            <a th:href="@{/home}" class="navbar-brand p-0">
                <h1 class="text"><img th:src="@{img/scope-india-logo-bird.png}" alt="Logo">Scope India</h1>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto py-0">
                    <a th:href="@{/home}" class="nav-item nav-link">Home</a>
                    <a th:href="@{/about}" class="nav-item nav-link">About</a>
                    <a th:href="@{/courses}" class="nav-item nav-link">Cources</a>
                    <a href="service.html" class="nav-item nav-link">Dashboard</a>
                    <a th:href="@{/contact}" class="nav-item nav-link">Contact</a>
                </div>
            </div>
        </nav>

        <div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px; background: linear-gradient(rgba(9, 30, 62, .7), rgba(9, 30, 62, .7)), url(../img/headerbackground.jpg) center center no-repeat;">
            <div class="row py-5">
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h3 th:text="${success}">Success</h3>
                    </div>
                    <div class="card-body">
                            <div class="mb-3">
                        <a th:text="${successdis}">scope</a>
                        <a th:if="${verification}" th:text="${verification}"></a>
                        <a class="fw-bold" th:if="${verify}" th:text="${verify}"  id="redirect"></a>
                    </div>
                    <div id="countdownMessage" style="display:none;">
                        <p class="fw-bold text-danger" id="countdown">Redirecting in 5 seconds...</p>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    
<script>
        $(document).ready(function () {
            // Check if the element with id="redirect" is present
            if ($('#redirect').length) {
                // Show the countdown message
                $('#countdownMessage').show();
                let timeLeft = 10; // Countdown time in seconds
                const countdownElement = document.getElementById("countdown");

                // Start the countdown
                const countdownInterval = setInterval(function () {
                    countdownElement.innerHTML = "Redirecting in " + timeLeft + " seconds...";
                    timeLeft--;

                    // When the timer reaches 0, stop countdown and redirect
                    if (timeLeft < 0) {
                        clearInterval(countdownInterval);
                        window.location.href = "/send-otp"; // Update with the URL to redirect to
                    }
                }, 1000); // Update every second
            }
        });
    </script>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{assets/lib/wow/wow.min.js}"></script>
    <script th:src="@{assets/lib/easing/easing.min.js}"></script>
    <script th:src="@{assets/lib/waypoints/waypoints.min.js}"></script>
    <script th:src="@{assets/js/main.js}"></script>
</body>
</html>
