<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Change Password</title>

 <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{assets/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <link th:href="@{assets/lib/animate/animate.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{assets/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{assets/css/style.css}" rel="stylesheet">
</head>
<body>

<div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner"></div>
    </div>
    <!-- Spinner End -->




    <!-- Navbar Start -->
    <div class="container-fluid position-relative p-0">
        <nav class="navbar navbar-expand-lg navbar-dark px-5 py-3 py-lg-0 d-flex justify-content-center">
            <a th:href="@{/home}" class="navbar-brand p-0">
                <h1 class="text"><img th:src="@{img/scope-india-logo-bird.png}" alt="Logo">Scope India</h1>
            </a>

        </nav>

        <div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px; background: linear-gradient(rgba(9, 30, 62, .7), rgba(9, 30, 62, .7)), url(../img/headerbackground.jpg) center center no-repeat;">
            <div class="row ">
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h3>Set New Password</h3>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/change-password}" method="post">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Current Password:</label>
            					<input type="password" id="currentPassword" class="form-control" name="currentPassword" placeholder="Enter current password" required />
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New Password:</label>
            					<input type="password" id="newPassword" class="form-control" name="newPassword" placeholder="Enter new password" required />
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm New Password:</label>
            					<input type="password" id="confirmPassword" class="form-control" name="confirmPassword" placeholder="Confirm new password" required />
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Change Password</button>
                        </form>
                        <p th:if="${message}" th:text="${message}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
	
	<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{assets/lib/wow/wow.min.js}"></script>
    <script th:src="@{assets/lib/easing/easing.min.js}"></script>
    <script th:src="@{assets/lib/waypoints/waypoints.min.js}"></script>
    <script th:src="@{assets/lib/counterup/counterup.min.js}"></script>
    <script th:src="@{assets/js/main.js}"></script>
</body>
</html>
