<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&amp;family=Open+Sans:wght@300;400;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    
    <title>Register</title>
    <style>
        .trns{
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            font-size: 16px;
        }
        .inp{
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            
        }
        .inp:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.9);
        }
        .form-select{
          background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
        }
        .form-select:hover{
          outline: none;
          background: rgba(255, 255, 255, 0.9);
          color: black;
        }
        body {
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>
    <main class="main" id="top" >
        <!-- ============================================-->
        <!-- <section> begin ============================-->
        <section class="text-center py-0"  style=" background: linear-gradient(rgba(9, 30, 62, .7), rgba(9, 30, 62, .7)), url(../img/headerbackground.jpg) center center no-repeat;background-size: 100% 100%;">
          <!--/.bg-holder-->
          <div class="container " >
            <div class="row min-vh-100 align-items-center ">
              <div class="col-md-9 col-lg-6 mx-auto pb-5 pt-5" >
                <div class="card w-90   trns rounded">
                    
                  <div class="card-body p-md-5 rounded text-white ">
                    <a th:href="@{/home}"><img class="w-75" src="img/scope-india-logo-web.png" alt="logo" /></a>
                    <h4 class="text-uppercase  fs-0 fs-md-1">Register To Scope</h4>
                    <form   th:action="@{/send}" method="post" th:object="${registeruser}" enctype="multipart/form-data"  class="text-start mt-3">
                      <div class="row align-items-center g-4">
                        <div data-mdb-input-init class="form-outline col-6 inp" style="width: 45%;">
                          <input  type="text" name="first" th:field="*{fname}" class="form-control text-white" />
                          <label class="form-label text-white" >First Name</label>
                        </div>
                        <span th:if="${#fields.hasErrors('fname')}" th:errors="*{fname}">error</span>
                        <div data-mdb-input-init class="col-6 form-outline inp" style="width: 45%;margin-left: 5%;"><input name="last" th:field="*{lname}"  class="form-control text-white" type="text"  aria-label="Last Name" />
                          <label class="form-label text-white" >Last Name</label></div>
                        <div class="col-3">Gender</div>
                        <div class="col-3"><input  type="radio" th:field="*{gender}" class="form-check-input " id="radio1" name="optradio" value="male"> Male</div>
                        <div class="col-3"><input  type="radio" th:field="*{gender}" class="form-check-input " id="radio1" name="optradio" value="female" > Female</div>
                        <div class="col-3"><input  type="radio" th:field="*{gender}" class="form-check-input " id="radio1" name="optradio" value="others" > Other</div> 
                        <div class="col-3">Date Of Birth</div>
                        <div class="col-6"> <input th:field="*{dob}" class="form-control inp" type="date" placeholder="Date Of Birth" aria-label="Date Of Birth" /></div>
                        
                        <div data-mdb-input-init class="form-outline col-6 inp" >
                          <input  type="email"  name="mail"  th:field="*{email}" class="form-control text-white" aria-label="Email Address"/>
                          <label class="form-label text-white" >Email Address</label>
                        </div>
                         <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger d-block mt-1">Email error</span>
                          
                        <div data-mdb-input-init class="form-outline col-6 inp" >
                          <input name="number"  th:field="*{phonenum}" type="tel"  class="form-control text-white" aria-label="Phone Number" />
                          <label class="form-label text-white" >Phone Number</label>
                        </div>
                        <div class="col-3">Country</div>
                        <div class="col-md-9"> <select th:field="*{country}" name="Country"class="form-select">
                          <option  value="0">--Select--</option>
                          <option th:each="country:${countries}" th:text="${country.countryname}" th:value="${country.countryid}">
                        </select></div>
                        <div class="col-3">State</div>
                        <div class="col-md-9"> <select name="state" th:field="*{state}" class="form-select " aria-placeholder="State">
                          <option value="0">--Select--</option>
                        </select></div>
                        <div class="col-3">City</div>
                        <div class="col-md-9"> <select  name="City" th:field="*{city}" class="form-select " aria-placeholder="State">
                          <option value="0">--Select--</option>
                        </select></div>
                        <div class="col-3">Hobbies</div>
                        <div class="col-3"><input  type="checkbox" th:field="*{hobbies}"  class="form-check-input" id="Hobbies"  value="Cricket"> Cricket</div>
                        <div class="col-3"><input  type="checkbox" th:field="*{hobbies}"  class="form-check-input" id="Hobbies"  value="football" > Football</div>
                        <div class="col-3"><input  type="checkbox" th:field="*{hobbies}"  class="form-check-input" id="Hobbies"  value="movies" > Movies</div> 
                        <div class="col-3">Upload Avatar</div>
                        <div class="col-md-9"><input type="file" name="image" class="form-control" ></div>
                      <div class="row align-items-center mt-3">
                        <div class="col-6 mt-3">
                          <div class="form-check"><input class="form-check-input" id="rememberMe" type="checkbox" value="" required /><label class="form-check-label text-500 lh-sm fw-semi-bold" for="rememberMe">I agree with the terms &amp; conditions</label></div>
                        </div>
                        <div class="col-6 mt-2 mt-sm-3"><button class="btn btn-primary w-100" type="submit">Create Account</button></div>
                      </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div><!-- end of .container-->
        </section><!-- <section> close ============================-->
        <!-- ============================================-->
  
      </main>
  
          <script>
     		$(document).ready(function(){
     			$('#country').change(function(){
     				var countryid=$(this).val();
     				$.ajax({
     					url:'/states/'+countryid,
     					type:'GET',
     					success:function(data){
     						var stat=$("#state")
     						stat.empty();
     						$.each(data,function(index,state){
     							stat.append('<option value="'+state.stateid+'">'+state.statename+'</option>');
     						})
     					}
     				})
     			})
     		})
     		$(document).ready(function(){
     			$('#state').change(function(){
     				var stateid=$(this).val();
     				$.ajax({
     					url:'/cities/'+stateid,
     					type:'GET',
     					success:function(data){
     						var stat=$("#city")
     						stat.empty();
     						$.each(data,function(index,city){
     							stat.append('<option value="'+city.cityid+'">'+city.cityname+'</option>');
     						})
     					}
     				})
     			})
     		})
     </script> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
